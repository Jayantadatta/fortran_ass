<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortran Practice Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' fill='%23d33'/%3E%3Crect x='9' width='7' height='7' fill='%233a3'/%3E%3Crect y='9' width='7' height='7' fill='%2336c'/%3E%3Crect x='9' y='9' width='7' height='7' fill='%23db3'/%3E%3C/svg%3E">
<style>
:root{
  --face:#f0f0f0; --edge:#a0a0a0; --line:#d4d4d4; --sel:#cce8ff; --selb:#99d1ff; --ink:#000; --dim:#555;
  --mono:"Courier New",Courier,monospace; --ui:"Segoe UI",Tahoma,Arial,sans-serif; --lh:17px; --fs:13.5px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--face);color:var(--ink);font:12px var(--ui);display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;color:inherit}
/* menu bar */
#menubar{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 2px;position:relative;z-index:30}
.menu{padding:3px 8px;cursor:default;position:relative}
.menu:hover,.menu.open{background:var(--sel)}
.drop{display:none;position:absolute;left:0;top:100%;background:#f2f2f2;border:1px solid #999;box-shadow:2px 2px 4px #0004;min-width:250px;padding:2px 0}
.menu.open .drop{display:block}
.mi{display:flex;justify-content:space-between;gap:28px;padding:4px 22px;white-space:nowrap}
.mi:hover{background:var(--selb)}
.mi.off{color:#999;pointer-events:none}
.mi kbd{font:inherit;color:#444}
.msep{border-top:1px solid #ccc;margin:3px 0}
/* toolbar */
#toolbar{display:flex;align-items:center;gap:2px;padding:3px 4px;border-bottom:1px solid var(--edge);background:linear-gradient(#fafafa,#e9e9e9);flex-wrap:wrap}
.tb{width:26px;height:24px;border:1px solid transparent;background:none;border-radius:2px;display:grid;place-items:center;padding:0;cursor:default}
.tb:hover{border-color:var(--selb);background:var(--sel)}
.tb:active{background:var(--selb)}
.tb svg{width:18px;height:18px}
.tsep{width:1px;height:20px;background:#bbb;margin:0 4px}
.tgrip{width:3px;height:20px;border-left:1px dotted #888;border-right:1px dotted #888;margin:0 3px 0 1px}
#toolbar select,#toolbar .btn{height:22px;font:12px var(--ui)}
.btn{border:1px solid #adadad;background:#e1e1e1;padding:0 9px;border-radius:2px;cursor:default;white-space:nowrap}
.btn:hover{background:#e5f1fb;border-color:#0078d7}
.btn.go{background:#dff3df;border-color:#4a4}
.btn.warn{background:#fde8e6;border-color:#c55}
.btn:disabled{color:#999;background:#eee;border-color:#ccc}
#timer{font:bold 14px Consolas,monospace;padding:1px 8px;border:1px solid #999;background:#fff;min-width:64px;text-align:center}
#timer.run{color:#0a5c0a}#timer.low{color:#c00;background:#fff0f0}
#modeNote{color:var(--dim);margin-left:4px}
.spacer{flex:1}
/* main */
#main{flex:1;display:flex;min-height:0}
.pane{background:#fff;border:1px solid var(--edge);display:flex;flex-direction:column;min-width:0;min-height:0}
.cap{background:linear-gradient(#e4ecf7,#c9d7ea);border-bottom:1px solid var(--edge);padding:2px 6px;font-weight:600;display:flex;justify-content:space-between}
.cap span.x{cursor:default;padding:0 4px;font-weight:400}
#left{width:226px;margin:2px}
#center{flex:1;display:flex;flex-direction:column;min-width:0;margin:2px 0}
#right{width:440px;margin:2px}
.hide{display:none!important}
.tabs{display:flex;background:var(--face);border-bottom:1px solid var(--edge);padding:2px 2px 0;gap:1px;overflow:hidden;flex-shrink:0}
.tab{padding:3px 9px;border:1px solid var(--edge);border-bottom:none;background:#e3e3e3;border-radius:3px 3px 0 0;white-space:nowrap;cursor:default;display:flex;gap:6px;align-items:center;margin-bottom:-1px}
.tab.on{background:#fff;font-weight:600;border-bottom:1px solid #fff}
.tab .x{color:#888;font-weight:400}.tab .x:hover{color:#c00}
.tab.ro{font-style:italic}
/* tree */
#tree{flex:1;overflow:auto;padding:4px 2px;font-size:12px}
.tn{padding:1px 4px;white-space:nowrap;cursor:default;display:flex;align-items:center;gap:4px}
.tn:hover{background:#eef6ff}.tn.on{background:var(--sel);outline:1px solid var(--selb)}
.tn b.tw{display:inline-block;width:10px;font-weight:400;color:#666;text-align:center}
.ic{display:inline-block;width:13px;text-align:center;font-size:11px}
.s0{color:#bbb}.s1{color:#e08a00}.s2{color:#1a9a1a}.s3{color:#d4a100}
.tfile{color:#222}.tq{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
/* editor */
#edwrap{flex:1;display:flex;flex-direction:column;min-height:120px;border:1px solid var(--edge);background:#fff}
#ed{flex:1;position:relative;overflow:hidden;background:#fff;font:var(--fs)/var(--lh) var(--mono)}
#gutter{position:absolute;left:0;top:0;bottom:0;width:52px;background:#f0f0f0;border-right:1px solid #d0d0d0;overflow:hidden;z-index:3;color:#404040}
#gin{position:absolute;left:0;right:0;top:0;padding-top:2px}
.gl{height:var(--lh);text-align:right;padding-right:16px;position:relative}
.gl i{position:absolute;right:3px;top:4px;width:9px;height:9px}
.gl.e i{background:#e11;border:1px solid #800}.gl.w i{background:#f5c400;border:1px solid #a80;border-radius:50%}
#hl,#ta{position:absolute;margin:0;border:0;padding:2px 4px;font:inherit;white-space:pre;tab-size:4;letter-spacing:0}
#hl{left:52px;top:0;pointer-events:none;z-index:1;min-width:100%}
#ta{left:52px;top:0;width:calc(100% - 52px);height:100%;resize:none;outline:none;background:transparent;color:transparent;caret-color:#000;z-index:2;overflow:auto;user-select:text}
#ta::selection{background:#3399ff55}
#ta.plain{color:#000}
#edEmpty{position:absolute;inset:0;display:grid;place-items:center;color:#888;background:#ababab;z-index:5;font:13px var(--ui);text-align:center}
.k{color:#0000a0;font-weight:bold}.c{color:#8a8a8a;font-style:italic}.s{color:#0000ff}.n{color:#e000e0}.o{color:#ff0000}.f{color:#007878}
/* logs */
#logs{height:220px;margin-top:3px;flex-shrink:0}
.logbody{flex:1;overflow:auto;background:#fff;user-select:text}
#buildlog{font:12px/15px var(--mono);white-space:pre-wrap;padding:4px 6px;margin:0}
#buildlog .err{color:#c00}#buildlog .ok{color:#00008b}#buildlog .hd{color:#00008b}
table.grid{border-collapse:collapse;width:100%;font:12px var(--ui)}
.grid th{position:sticky;top:0;background:#eee;border:1px solid #ccc;text-align:left;padding:2px 6px;font-weight:600}
.grid td{border-bottom:1px solid #eee;padding:2px 6px;vertical-align:top}
.grid tr.E td{color:#c00}.grid tr.W td{color:#00008b}.grid tr.H td{color:#444;background:#fffbe0;font-style:italic}
.grid tr.clk:hover td{background:#eef6ff}
.verdict{padding:6px 10px;font-size:13px;font-weight:600;border-bottom:1px solid #ccc}
.verdict.pass{background:#dff5df;color:#0a5c0a}.verdict.fail{background:#fde4e1;color:#a00}.verdict.mid{background:#fff5cc;color:#6a5000}
.diff{display:grid;grid-template-columns:1fr 1fr;font:12px/15px var(--mono)}
.diff h4{margin:0;padding:3px 6px;background:#eee;border-bottom:1px solid #ccc;font:600 12px var(--ui);position:sticky;top:0}
.diff pre{margin:0;padding:0}.diff .col{overflow-x:auto;border-right:1px solid #ccc}
.dl{padding:0 6px;white-space:pre;min-height:15px}.dl.bad{background:#ffd9d6}.dl.miss{background:#ffeab0}
/* right panel */
#rbody{flex:1;overflow:auto;padding:8px 10px;user-select:text;font-size:13px;line-height:1.45}
#rbody pre{font:12.5px/16px var(--mono);background:#f6f6f6;border:1px solid #ddd;padding:6px 8px;overflow-x:auto;margin:6px 0}
#rbody h2{font-size:15px;margin:0 0 2px}#rbody h3{font-size:13px;margin:14px 0 2px;color:#00008b}
#rbody .meta{color:var(--dim);margin-bottom:8px}
.files{border:1px solid #cdd;background:#f3f8ff;padding:6px 8px;margin:8px 0}
.files code{font:bold 12.5px var(--mono);color:#00008b}
.sol{font:12.5px/16px var(--mono);border:1px solid #ddd;background:#fff;overflow-x:auto}
.sl{white-space:pre;padding:0 6px;min-height:16px;border-left:3px solid transparent}
.sl.done{background:#e3f6e3;border-left-color:#3a3}.sl.next{background:#fff3b0;border-left-color:#d4a100}
#rtabs{flex-wrap:wrap;overflow:visible}#rtabs .tab{padding:3px 7px}
.exhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bbtn{width:22px;height:22px;border:1px solid #999;background:#eee;border-radius:3px;font:bold 12px var(--ui);padding:0;cursor:default}
.bbtn:hover{border-color:#0078d7}.bbtn.on{background:#00008b;color:#fff;border-color:#00008b}
.steps{margin:6px 0;padding-left:22px}.steps li{margin:0 0 7px}
.steps code,#rbody p code{font:12.5px var(--mono);background:#f1f1f1;border:1px solid #e2e2e2;padding:0 3px;color:#00008b}
.bn{font-family:"Nirmala UI","Vrinda","Noto Sans Bengali","Segoe UI",sans-serif;font-size:14px;line-height:1.7}
.lock{border:1px dashed #b99;background:#fff7f5;padding:14px;text-align:center;margin-top:10px}
.bar{height:8px;background:#ddd;border-radius:4px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:#3a3}
/* status */
#status{display:flex;border-top:1px solid var(--edge);background:var(--face);font-size:11px}
#status div{padding:2px 10px;border-right:1px solid #ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stPath{flex:1}
/* dialogs */
#veil{position:fixed;inset:0;background:#0005;z-index:50;display:none;place-items:center}
#veil.on{display:grid}
.dlg{background:var(--face);border:1px solid #555;box-shadow:0 8px 30px #0007;min-width:360px;max-width:min(860px,94vw);max-height:90vh;display:flex;flex-direction:column}
.dlg .dt{background:#fff;padding:6px 10px;font-weight:600;border-bottom:1px solid #ccc;display:flex;justify-content:space-between}
.dlg .db{padding:14px 16px;overflow:auto;user-select:text;font-size:13px;line-height:1.5}
.dlg .df{padding:8px 12px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #ddd}
.dlg input[type=text],.dlg input[type=number]{font:13px var(--ui);padding:3px 5px;border:1px solid #999}
.dlg pre{font:12.5px/16px var(--mono);background:#fff;border:1px solid #ddd;padding:6px 8px;overflow-x:auto}
.dlg .btn{height:24px;min-width:76px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.modes div{background:#fff;border:1px solid #ccc;padding:8px 10px}.modes b{color:#00008b}
#con{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#0006}
#con.on{display:grid}
#conwin{width:min(900px,92vw);height:min(480px,80vh);background:#0c0c0c;border:1px solid #666;display:flex;flex-direction:column;box-shadow:0 10px 40px #000a}
#contitle{background:#fff;color:#000;padding:5px 10px;font-size:12px;display:flex;justify-content:space-between}
#conout{flex:1;margin:0;padding:6px 8px;color:#ccc;font:14px/17px Consolas,"Lucida Console",monospace;white-space:pre-wrap;overflow:auto;user-select:text}
</style>
</head>

  <span class="tgrip"></span>
  <button class="tb" data-act="newFile" title="New empty file (Ctrl+Shift+N)"><svg viewBox="0 0 18 18"><path d="M4 1.5h7l3.5 3.5v11.5h-10.500z" fill="#fff" stroke="#555"/><path d="M11 1.500v3.500h3.500" fill="none" stroke="#555"/><path d="M13 10v5M10.500 12.500h5" stroke="#1a9a1a" stroke-width="2"/></svg></button>

  <div id="timer" title="Time on this attempt. Starts at your first keystroke.">00:00</div>

  <div class="pane" id="left">

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isF = n => /\.(f90|f95|f03|f|for)$/i.test(n);
const fmtT = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('fpl:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fpl:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('fpl:' + k); } catch {} },
};

/* ---------- state ---------- */
let P = [], byId = {}, info = {}, progress = {};
let cur = null, mode = 'copy', D = null;      // D = current draft
let exam = store.get('exam', null);            // running mock exam
let logTab = 'log', rTab = 'q', lastCheck = null, buildRows = [], logHtml = '', markers = {}, busy = false;
const ta = $('#ta'), hl = $('#hl'), gin = $('#gin');
const locked = () => mode === 'mock';

/* ---------- syntax highlighting ---------- */
const KW = new Set(('program end implicit none integer real double precision complex character logical parameter dimension allocatable allocate deallocate intent in out inout do while if then else elseif endif enddo select case default stop exit cycle call subroutine function recursive result return contains module use only open close read write print format goto continue save data external intrinsic type kind optional pure elemental interface rewind inquire file status unit advance').split(' '));
const INTR = new Set(('abs sqrt exp log log10 sin cos tan asin acos atan atan2 sinh cosh tanh mod modulo max min sum product maxval minval int nint dble float floor ceiling len len_trim trim adjustl adjustr index achar iachar char ichar random_number random_seed size matmul transpose dot_product huge tiny epsilon sign cmplx repeat maxloc minloc count any all merge reshape').split(' '));
const TOK = /(!.*$)|('(?:[^']|'')*'?|"(?:[^"]|"")*"?)|(\.(?:and|or|not|eqv|neqv|true|false|eq|ne|lt|le|gt|ge)\.)|(\b\d+(?:\.\d*)?(?:[de][+-]?\d+)?(?:_\w+)?|\.\d+(?:[de][+-]?\d+)?)|([a-z_]\w*)|([-+*\/=<>(),:%&;\[\]]+)|(\s+|.)/gi;
function hlLine(line) {
  let out = '';
  line.replace(TOK, (m, c, s, lo, n, id, op) => {
    const e = esc(m);
    if (c) out += '<span class="c">' + e + '</span>';
    else if (s) out += '<span class="s">' + e + '</span>';
    else if (lo) out += '<span class="k">' + e + '</span>';
    else if (n) out += '<span class="n">' + e + '</span>';
    else if (id) { const l = id.toLowerCase(); out += KW.has(l) ? '<span class="k">' + e + '</span>' : INTR.has(l) ? '<span class="f">' + e + '</span>' : e; }
    else if (op) out += '<span class="o">' + e + '</span>';
    else out += e;
    return '';
  });
  return out;
}

/* ---------- editor ---------- */
let lineCount = 0;
function paint() {
  const name = D && D.active, text = ta.value, lines = text.split('\n');
  const plain = !name || !isF(name);
  ta.classList.toggle('plain', plain);
  hl.innerHTML = plain ? '' : lines.map(hlLine).join('\n') + '\n';
  const mk = (D && markers[name]) || {};
  let g = '';
  for (let i = 1; i <= lines.length; i++) g += '<div class="gl ' + (mk[i] || '') + '">' + i + (mk[i] ? '<i></i>' : '') + '</div>';
  gin.innerHTML = g; lineCount = lines.length;
  syncScroll(); caret();
}
function syncScroll() {
  hl.style.transform = 'translate(' + -ta.scrollLeft + 'px,' + -ta.scrollTop + 'px)';
  gin.style.transform = 'translateY(' + -ta.scrollTop + 'px)';
}
function caret() {
  const s = ta.selectionStart, v = ta.value, ls = v.lastIndexOf('\n', s - 1) + 1;
  const ln = v.slice(0, s).split('\n').length;
  $('#stPos').textContent = 'Line ' + ln + ', Col ' + (s - ls + 1) + ', Pos ' + s;
}
function rep(s, e, text) {
  ta.focus(); ta.setSelectionRange(s, e);
  const ok = text === '' ? (s === e || document.execCommand('delete')) : document.execCommand('insertText', false, text);
  if (!ok) ta.setRangeText(text, s, e, 'end');
}
function onInput() {
  if (!D || !D.active || isRO(D.active)) return;
  D.files[D.active] = ta.value;
  D.dirty[D.active] = true;
  if (!D.started && ta.value.trim()) D.started = true;
  delete markers[D.active];
  paint(); saveDraft(); renderTabs(); queueMatch();
}
ta.addEventListener('input', onInput);
ta.addEventListener('scroll', syncScroll);
['keyup', 'click', 'focus'].forEach(e => ta.addEventListener(e, caret));
const OPEN = /^(do\b|if\b.*\bthen$|else\b|program\b|subroutine\b|recursive\b|contains$|select\b|case\b|module\b|.*\bfunction\b)/i;

    else if ((m = /^\s*(Error|Warning|Fatal Error):\s*(.*)$/.exec(l))) { rows.push({ file: pend ? pend.file : src, line: pend ? pend.line : 0, type: m[1][0] === 'W' ? 'W' : 'E', msg: m[2] }); pend = null; }

/* ---------- output comparison ---------- */
const NUM = /^[-+]?(\d+\.?\d*|\.\d+)([ed][-+]?\d+)?$/i;

}

});
ta.addEventListener('paste', e => { if (mode !== 'copy' && mode !== 'skeleton') return; const t = (e.clipboardData || {}).getData ? e.clipboardData.getData('text') : ''; if (t.split('\n').length > 3) { e.preventDefault(); dialog('Paste blocked', 'Typing is the practice. Pasting more than three lines is switched off in this mode.', ['OK']); } });
addEventListener('beforeunload', () => saveDraft());

function renderAll() {
  renderTree(); renderTabs(); renderRight(); renderLogs();
  const note = { copy: 'Solution visible: type along', skeleton: 'Fill in the missing lines', exam: 'Blank file, from memory', mock: 'MOCK EXAM running' }[mode];
  $('#modeNote').textContent = note;
  $('#modeSel').disabled = locked(); $('#btnCheck').disabled = locked();
  $('#btnMock').innerHTML = exam ? '&#9632; Finish exam' : '&#9201; Mock exam';
  $('#btnMock').className = 'btn' + (exam ? ' warn' : '');
}

(async function init() {
  let data;
  try { data = await (await fetch('/api/problems')).json(); progress = await (await fetch('/api/progress')).json(); }
  catch { document.body.innerHTML = '<p style="padding:30px;font-size:15px">The practice server is not running. Double-click <b>Start Practice.bat</b> in the practice folder.</p>'; return; }
  P = data.problems;
  for (const p of P) { byId[p.id] = p; info[p.id] = (window.QUESTIONS || {})[p.id] || { t: p.source, topic: '', h: 'See the assignment sheet.' }; }
  if (!P.length) { document.body.innerHTML = '<p style="padding:30px">No Assignment-N/Question-N folders were found next to the practice folder.</p>'; return; }
  if (exam && !exam.ids.every(id => byId[id])) { exam = null; store.del('exam'); }
  const last = store.get('last', null);
  if (exam) openProblem(exam.ids.includes(last && last.id) ? last.id : exam.ids[0], 'mock');
  else openProblem(last && byId[last.id] ? last.id : P[0].id, last && last.mode !== 'mock' ? last.mode : 'copy');
  if (!store.get('seen', false)) { store.set('seen', true); acts.howto(); }
})();
</script>
</body>
